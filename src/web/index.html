<!-- 跨源隔离垫片：必须在任何业务脚本之前执行。它注册一个 Service Worker 给同源响应
     补上 Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy，让页面进入
     crossOriginIsolated 状态——sherpa-onnx 的 wasm 是 pthreads 构建（共享内存 +
     em-pthread worker），没有这个状态连初始化都会抛 DataCloneError。
     首次访问会自动刷新一次（SW 接管后才生效），之后即为隔离态。 -->
<script src="coi-serviceworker.js"></script>
<div class="container" id="appRoot">

<!-- pitfall: 此处不要手写 <script src="panel.js">——HtmlWebpackPlugin 的 inject:true
     已自动注入 <script defer src="panel.js">，手写会让同一脚本执行两遍：
     panel.ts 的消息监听器注册两次，每条 SENTENCE_DONE 被处理两次，字幕列表重复。 -->
