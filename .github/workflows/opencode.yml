name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # 1. 动态生成 opencode.json 配置文件
      - name: Create opencode.json
        env:
          MODEL_NAME: ${{ secrets.MY_PRIVATE_MODEL }}
          BASE_URL: ${{ secrets.MY_PRIVATE_URL }}
          API_KEY: ${{ secrets.MY_PRIVATE_KEY }}
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "myprovider": {
                "name": "My Custom API",
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "baseURL": "${BASE_URL}",
                  "apiKey": "{env:API_KEY}"
                },
                "models": {
                  "${MODEL_NAME}": {
                    "name": "${MODEL_NAME}"
                  }
                }
              }
            }
          }
          EOF

      # 2. 运行 OpenCode
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_CONFIG: ${{ github.workspace }}/opencode.json
          API_KEY: ${{ secrets.MY_PRIVATE_KEY }}
        with:
          model: myprovider/${{ secrets.MY_PRIVATE_MODEL }}