name: Test Models

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download & package translation models (diagnostic)
        run: |
          python3 -m pip install -q --user huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          pairs = [('Xenova/opus-mt-en-zh', 'opus-mt-en-zh'), ('Xenova/opus-mt-zh-en', 'opus-mt-zh-en')]
          files = [
              'config.json', 'generation_config.json', 'tokenizer.json',
              'tokenizer_config.json', 'special_tokens_map.json', 'quantize_config.json',
              'source.spm', 'target.spm', 'vocab.json',
              'onnx/encoder_model_quantized.onnx',
              'onnx/decoder_model_merged_quantized.onnx',
          ]
          for repo, local in pairs:
              for f in files:
                  hf_hub_download(repo, f, local_dir=local)
          PY
          echo "=== tree ==="
          find opus-mt-en-zh opus-mt-zh-en -type f -printf '%p %s bytes\n' | sort
          echo "=== zip ==="
          zip -r models.zip opus-mt-en-zh opus-mt-zh-en
          ls -lh models.zip
          unzip -l models.zip | tail -30
